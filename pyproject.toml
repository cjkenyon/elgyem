[project]
name = "elgyem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Cade Kenyon", email = "cjkenyon01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
elgyem = "elgyem:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]
